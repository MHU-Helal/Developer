<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Expert jQuery Developer for dynamic front-end solutions, UI enhancements, and performance optimization." />
    <meta name="keywords" content="jQuery Developer, JavaScript Expert, Frontend Developer, Web Animation, AJAX, DOM Manipulation" />
    <meta property="og:title" content="jQuery Developer | Interactive Web Solutions" />
    <meta property="og:description" content="Enhance your website interactivity and performance with professional jQuery development." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>jQuery Developer | Interactive Web Solutions</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "jQuery Developer Services",
        "description": "Providing expert front-end solutions using jQuery, AJAX, and DOM optimization.",
        "provider": {
          "@type": "Organization",
          "name": "WDPF Developer"
        },
        "areaServed": "Worldwide"
      }
    </script>
  </head>

  <body class="bg-gray-50 text-gray-800">
    <!-- Hero -->
    <header class="text-center bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-600 text-white py-16">
      <h1 id="heroTitle" class="text-5xl font-extrabold mb-4"></h1>
      <p id="heroSubtitle" class="text-xl max-w-3xl mx-auto"></p>
      <div class="mt-8 space-x-4">
        <a id="meetingLink" target="_blank" class="bg-white text-blue-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-100">📅 Schedule a Meeting</a>
        <a id="emailLink" class="bg-gray-900 text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-800">✉️ Send an Email</a>
      </div>
    </header>

    <!-- Skills/Services -->
    <section class="max-w-6xl mx-auto px-4 py-16">
      <h2 id="servicesTitle" class="text-3xl font-bold text-center mb-12"></h2>
      <div id="servicesContainer" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </section>

    <!-- Projects -->
    <section class="bg-white py-16">
      <div class="max-w-6xl mx-auto px-4 text-center">
        <h2 id="projectsTitle" class="text-3xl font-bold mb-8"></h2>
        <div id="projectsContainer" class="grid md:grid-cols-3 gap-6"></div>
      </div>
    </section>

    <!-- Testimonials -->
    <section class="bg-blue-50 py-16 text-center relative">
      <h2 id="testimonialsTitle" class="text-3xl font-bold mb-10"></h2>
      <div id="testimonialsContainer" class="max-w-3xl mx-auto"></div>
      <div class="mt-6 space-x-3">
        <button id="prevTestimonial" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded">⟨</button>
        <button id="nextTestimonial" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded">⟩</button>
      </div>
    </section>

    <!-- Contact -->
    <section class="py-16 bg-white">
      <div class="max-w-lg mx-auto text-center">
        <h2 id="contactTitle" class="text-3xl font-bold mb-6"></h2>
        <p id="contactDescription" class="mb-6"></p>
        <a id="contactEmail" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700">✉️ Send Email</a>
        <a id="contactMeeting" target="_blank" class="bg-gray-800 text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-700 ml-3">📅 Schedule Meeting</a>
      </div>
    </section>

    <footer class="bg-gray-900 text-gray-400 text-center py-6">
      <p>© <span id="currentYear"></span> jQuery Developer | All Rights Reserved</p>
    </footer>

    <script>
        // Set current year
        $("#currentYear").text(new Date().getFullYear());

      const contentData = {
        hero: {
          title: "Expert jQuery Developer",
          subtitle:
            "Crafting dynamic, responsive, and high-performance front-end solutions using jQuery and modern JavaScript.",
          email: "info.m.helal@gmail.com",
          calendly: "https://calendly.com/dev-m-helal"
        },
        services: {
          title: "What I Offer",
          items: [
            {
              title: "Dynamic UI Components",
              description:
                "Build and enhance user interfaces with jQuery animations, modals, sliders, and tabs."
            },
            {
              title: "AJAX Integration",
              description:
                "Seamless data fetching without reloads — connecting frontend to APIs and PHP backends."
            },
            {
              title: "DOM Manipulation & Events",
              description:
                "Create interactive elements and handle real-time user interactions efficiently."
            },
            {
              title: "Performance Optimization",
              description:
                "Minify scripts, debounce events, and improve client-side speed using best jQuery practices."
            },
            {
              title: "Cross-Browser Compatibility",
              description:
                "Ensure consistent performance across Chrome, Firefox, Safari, and Edge."
            },
            {
              title: "Legacy Code Maintenance",
              description:
                "Upgrade or refactor old jQuery-based applications into maintainable, optimized code."
            }
          ]
        },
        projects: {
          title: "Highlighted Projects",
          items: [
            {
              title: "Interactive Dashboard",
              desc: "Built a real-time analytics dashboard using jQuery, Chart.js, and AJAX.",
              link: "#"
            },
            {
              title: "eCommerce Filters",
              desc: "Developed advanced search and filter system for WooCommerce using jQuery.",
              link: "#"
            },
            {
              title: "Custom Slideshow Plugin",
              desc: "Created a lightweight image slider plugin with fade and swipe support.",
              link: "#"
            }
          ]
        },
        testimonials: {
          title: "Client Feedback",
          items: [
            {
              text: "Incredibly skilled and detail-oriented. Our web UI is now smooth and intuitive!",
              author: "— Sarah L., Product Manager"
            },
            {
              text: "Clean, optimized jQuery code that improved our site load time drastically.",
              author: "— Tom K., CTO"
            },
            {
              text: "Quick delivery and excellent communication. Highly recommended!",
              author: "— Jane R., Freelancer"
            }
          ]
        },
        contact: {
          title: "Let's Work Together",
          description:
            "Need interactive, dynamic front-end solutions? Reach out today to discuss your project.",
          email: "info.m.helal@gmail.com",
          calendly: "https://calendly.com/dev-m-helal"
        }
      };

      // Inject content dynamically
      $(function () {
        // Hero Section
        $('#heroTitle').text(contentData.hero.title);
        $('#heroSubtitle').text(contentData.hero.subtitle);
        $('#meetingLink').attr('href', contentData.hero.calendly);
        $('#emailLink').attr(
          'href',
          `mailto:${contentData.hero.email}?subject=Inquiry from ${contentData.hero.title}`
        );

        // Services
        $('#servicesTitle').text(contentData.services.title);
        contentData.services.items.forEach((srv) => {
          $('#servicesContainer').append(`
            <div class='bg-white shadow-lg rounded-lg p-6 hover:shadow-2xl transition'>
              <h3 class='text-xl font-bold mb-3 text-blue-700'>${srv.title}</h3>
              <p>${srv.description}</p>
            </div>
          `);
        });

        // Projects
        $('#projectsTitle').text(contentData.projects.title);
        contentData.projects.items.forEach((p) => {
          $('#projectsContainer').append(`
            <div class='bg-gray-100 p-6 rounded-lg shadow'>
              <h3 class='text-lg font-semibold mb-2'>${p.title}</h3>
              <p>${p.desc}</p>
              <a href='${p.link}' class='text-blue-600 hover:underline mt-2 inline-block'>View Project →</a>
            </div>
          `);
        });

        // Testimonials
        $('#testimonialsTitle').text(contentData.testimonials.title);
        contentData.testimonials.items.forEach((t, i) => {
          $('#testimonialsContainer').append(`
            <blockquote class='testimonial italic text-lg ${i === 0 ? '' : 'hidden'} mb-4'>
              “${t.text}”<br><span class='block mt-2 font-semibold'>${t.author}</span>
            </blockquote>
          `);
        });

        // Contact
        $('#contactTitle').text(contentData.contact.title);
        $('#contactDescription').text(contentData.contact.description);
        $('#contactEmail').attr(
          'href',
          `mailto:${contentData.contact.email}?subject=Inquiry from jQuery Developer Page`
        );
        $('#contactMeeting').attr('href', contentData.contact.calendly);

        // Testimonial Controls
        let current = 0;
        const testimonials = $('.testimonial');

        function showTestimonial(i) {
          testimonials.hide();
          $(testimonials[i]).fadeIn(600);
        }

        $('#nextTestimonial').on('click', function () {
          current = (current + 1) % testimonials.length;
          showTestimonial(current);
        });

        $('#prevTestimonial').on('click', function () {
          current = (current - 1 + testimonials.length) % testimonials.length;
          showTestimonial(current);
        });

        setInterval(() => $('#nextTestimonial').click(), 6000);
      });
    </script>
  </body>
</html>
