<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Google Ad 1280x100</title>

<style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

/* ===== AD CONTAINER ===== */
.ad {
  width: 1280px;
  height: 100px;
  max-width: 100%;
  display: flex;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #ffffff;
  border: 1px solid #e0e0e0;
  overflow: hidden;
  text-decoration: none;
  color: #111;
}

/* ===== IMAGE (LEFT) ===== */
.image {
  width: 22%;
  height: 100%;
  background: #f2f2f2;
}

.image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== CONTENT (RIGHT) ===== */
.content {
  width: 78%;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* TEXT GROUP */
.text {
  max-width: 75%;
}

h1 {
  margin: 0;
  font-size: 18px;
  line-height: 1.1;
}

h2 {
  margin: 3px 0;
  font-size: 14px;
  color: #555;
}

p {
  margin: 2px 0 0;
  font-size: 12px;
  color: #666;
}

/* CTA */
.cta {
  background: #0a66ff;
  color: #fff;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: bold;
  border-radius: 4px;
  white-space: nowrap;
}

/* ============================= */
/* ===== RESPONSIVE BREAKS ===== */
/* ============================= */

/* 1024px */
@media (max-width: 1024px) {
  h1 { font-size: 17px; }
  h2 { font-size: 13px; }
  p  { font-size: 11px; }
}

/* 768px */
@media (max-width: 768px) {
  .image { width: 26%; }
  h1 { font-size: 16px; }
  h2 { font-size: 12px; }
  p  { display: none; }
}

/* 660px */
@media (max-width: 660px) {
    .image { width: 28%; }
    .content {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
    }
    
    .text {
        max-width: 100%;
    }
    h1 { font-size: 15px; }

  .cta {
    margin-top: 6px;
    padding: 6px 12px;
    font-size: 12px;
  }
}


/* 300px */
@media (max-width: 300px) {
  .image { width: 35%; }
  h1 { font-size: 13px; }
  h2 { display: none; }
  .cta { font-size: 11px; padding: 5px 10px; }
}
</style>
</head>

<body>

<a href="{{CLICK_URL_UNESC}}https://decodemh.com" 
   class="ad" 
   target="_blank">

  <div class="image">
    <img src="https://images.pexels.com/photos/5424976/pexels-photo-5424976.jpeg" alt="Ad Image">
  </div>

  <div class="content">
    <div class="text">
      <h1>Google Ads Designer</h1>
      <h2>High-Impact Display Ads</h2>
      <p>High-performing ads built to convert more customers.</p>
    </div>

    <span class="cta">Get Started</span>
  </div>

</a>

</body>
</html>
