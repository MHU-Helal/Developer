<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>300x300 Google Ad</title>

<style>
* { box-sizing: border-box; }
body { margin: 0; }

.ad {
  width: 300px;
  height: 300px;
  display: flex;
  flex-direction: column;
  font-family: Arial, sans-serif;
  background: #fff;
  border: 1px solid #e0e0e0;
  text-decoration: none;
  color: #111;
}

.image {
  width: 100%;
  height: 70%;
  background: #f2f2f2;
  position: relative;
  overflow: hidden;
}

.image img {
  position: absolute;
  top: -130px;
  left: -50px;
  width: 350px;
  height: auto;
  object-fit: cover;
}

.content {
  text-align: center;
  height: 50%;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

h1 {
  margin: 0;
  font-size: 18px;
}

h2 {
  margin: 10px 0;
  font-size: 14px;
  color: #555;
}

p {
  margin: 0;
  font-size: 12px;
  color: #666;
  display: none;
}

.cta {
  margin-top: 10px;
  background: #0a66ff;
  color: #fff;
  text-align: center;
  padding: 8px 0;
  width: 140px;
  margin: 0 auto;
  font-size: 14px;
  font-weight: bold;
  border-radius: 4px;
}

@media (max-width: 300px) {
  .ad { width: 100%; height: 300px; }
}
</style>
</head>

<body>

<a href="https://decodemh.com" class="ad" target="_blank">
  <div class="image">
    <img src="https://images.pexels.com/photos/5424976/pexels-photo-5424976.jpeg" alt="">
  </div>
  <div class="content">
    <div>
      <h1>Google Ads Designer</h1>
      <h2>High-Impact Display Ads</h2>
      <p>Eye-catching creatives designed for premium placements and high engagement.</p>
    </div>
    <span class="cta">Get Started</span>
  </div>
</a>

</body>
</html>
