<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Google Ad 1280x300</title>

<style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

/* ===== AD CONTAINER ===== */
.ad {
  width: 1280px;
  height: 300px;
  max-width: 100%;
  display: flex;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #ffffff;
  border: 1px solid #e0e0e0;
  overflow: hidden;
  text-decoration: none;
  color: #111;
}

/* ===== IMAGE (LEFT) ===== */
.image {
  width: 40%;
  height: 100%;
  background: #f2f2f2;
}

.image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== CONTENT (RIGHT) ===== */
.content {
  width: 60%;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* TEXT GROUP */
.text {
  max-width: 70%;
}

h1 {
  margin: 0;
  font-size: 32px;
  line-height: 1.15;
}

h2 {
  margin: 10px 0;
  font-size: 18px;
  color: #555;
}

p {
  margin: 0;
  font-size: 14px;
  color: #666;
  line-height: 1.5;
}

/* CTA */
.cta {
  background: #0a66ff;
  color: #fff;
  padding: 12px 22px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 4px;
  white-space: nowrap;
}

/* ============================= */
/* ===== RESPONSIVE BREAKS ===== */
/* ============================= */

/* 1024px */
@media (max-width: 1024px) {
  h1 { font-size: 28px; }
  h2 { font-size: 16px; }
  p  { font-size: 13px; }
}

/* 768px */
@media (max-width: 768px) {
  .image { width: 42%; }
  .text { max-width: 75%; }
  h1 { font-size: 24px; }
}

/* 660px */
@media (max-width: 660px) {
  .image { width: 45%; }

  .content {
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }

  .text {
    max-width: 100%;
  }

  .cta {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 13px;
  }
}

/* 300px (safe fallback) */
@media (max-width: 300px) {
  .ad {
    height: auto;
    flex-direction: column;
  }

  .image {
    width: 100%;
    height: 160px;
  }

  h1 { font-size: 18px; }
  h2 { font-size: 14px; }
  p  { display: none; }

  .cta {
    margin-top: 10px;
    font-size: 12px;
    padding: 8px 16px;
  }
}
</style>
</head>

<body>

<a href="{{CLICK_URL_UNESC}}https://decodemh.com"
   class="ad"
   target="_blank">

  <div class="image">
    <img src="https://images.pexels.com/photos/5424976/pexels-photo-5424976.jpeg" alt="Ad Image">
  </div>

  <div class="content">
    <div class="text">
      <h1>Google Ads Designer</h1>
      <h2>High-Impact Display Ads</h2>
      <p>
        High-impact creatives built to scale across devices while maintaining brand clarity.
      </p>
    </div>

    <span class="cta">Get Started</span>
  </div>

</a>

</body>
</html>
