<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage of Banners</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container" style="background: rgb(0, 132, 255);">
        <iframe width="1280px" height="100px" style="margin: 10px 0; border-radius: 8px; border: 1px solid gray; box-sizing: border-box; overflow: hidden;" scrolling="no" src="banner-1280x100.html"></iframe>
        <div class="d-flex justify-content-between">
            <iframe width="240px" height="620px" style="background: #000 !important; border-radius: 8px; border: 1px solid gray; box-sizing: border-box; overflow: hidden;" scrolling="no" src="banner-240x620.html"></iframe>

            <div class="d-flex justify-content-between align-items-center flex-wrap" style="width: calc(100% - 260px);">

                <iframe width="1040px" height="100px" style="border-radius: 8px; border: 1px solid gray; box-sizing: border-box; overflow: hidden;" scrolling="no" src="banner-1040x100.html"></iframe>
                <iframe width="300px" height="100px" style="border-radius: 8px; border: 1px solid gray; box-sizing: border-box; overflow: hidden;" scrolling="no" src="banner-300x100.html"></iframe>
                <iframe width="300px" height="250px" style="border-radius: 8px; border: 1px solid gray; box-sizing: border-box; overflow: hidden;" scrolling="no" src="banner-300x250.html"></iframe>
                <iframe width="300px" height="300px" style="position: relative; border-radius: 8px; border: 1px solid gray; box-sizing: border-box; overflow: hidden;" scrolling="no" src="banner-300x300.html"></iframe>
            </div>
        </div>
        <iframe width="1280px" height="300px" style="margin: 10px 0; border-radius: 8px; border: 1px solid gray; box-sizing: border-box; overflow: hidden;" scrolling="no" src="banner-1280x300.html"></iframe>
    </div>



    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
