<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>300x250 Google Ad</title>

<style>
* { box-sizing: border-box; }
body { margin: 0; }

.ad {
  width: 300px;
  height: 250px;
  display: flex;
  flex-direction: column;
  font-family: Arial, sans-serif;
  background: #fff;
  border: 1px solid #e0e0e0;
  text-decoration: none;
  color: #111;
}

.image {
  height: 55%;
  background: #f2f2f2;
}

.image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.content {
  height: 45%;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

h1 {
  margin: 0;
  font-size: 18px;
}

h2 {
  margin: 6px 0;
  font-size: 13px;
  color: #555;
}

p {
  margin: 0;
  font-size: 12px;
  color: #666;
}

.cta {
  margin-top: 8px;
  background: #0a66ff;
  color: #fff;
  text-align: center;
  padding: 8px 0;
  font-size: 13px;
  font-weight: bold;
  border-radius: 4px;
}

@media (max-width: 300px) {
  .ad { width: 100%; height: auto; }
}
</style>
</head>

<body>

<a href="{{CLICK_URL_UNESC}}https://example.com" class="ad" target="_blank">
  <div class="image">
    <img src="https://images.pexels.com/photos/5424976/pexels-photo-5424976.jpeg" alt="">
  </div>
  <div class="content">
    <div>
      <h1>Google Ads Designer</h1>
      <h2>High-Impact Display Ads</h2>
      <p>Optimized creatives that convert better.</p>
    </div>
    <span class="cta">Get Started</span>
  </div>
</a>

</body>
</html>
