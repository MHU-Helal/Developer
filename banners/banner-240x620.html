<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Google Ad 240x620</title>

  <style>
    /* ===== RESET ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    /* ===== AD CONTAINER ===== */
    .ad {
      width: 240px;
      height: 620px;
      margin: auto;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      text-decoration: none;
      color: #111;
    }

    /* ===== IMAGE (TOP) ===== */
    .image {
      height: 55%;
      background: #f2f2f2;
      position: relative;
      overflow: hidden;
    }

    .image img {
      height: 500px;
      width: auto;
      position: absolute;
      top: -70px;
      right: -15px;
    }

    /* ===== CONTENT (BOTTOM) ===== */
    .content {
      height: 45%;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: baseline;
      text-align: center;
    }

    /* TEXT */
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
    }

    h2 {
      margin: 8px 0;
      font-size: 16px;
      color: #555;
    }

    p {
      margin: 16px 0;
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }

    /* CTA */
    .cta {
      margin: 12px auto;
      background: #0a66ff;
      color: #fff;
      text-align: center;
      padding: 10px 0;
      width: 160px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
    }

    /* ============================= */
    /* ===== RESPONSIVE FALLBACK ==== */
    /* ============================= */
    @media (max-width: 240px) {
      .ad {
        width: 240px;
        height: 620px;
      }

      .image {
        /* height: 200px; */
        width: 100%;
        height: 55%;
      }

      h1 {
        font-size: 18px;
      }

      h2 {
        font-size: 13px;
      }

      /* p  { display: none; } */

      .cta {
        width: 80%;
        font-size: 14px;
        padding: 8px 24px;
        margin: 12px auto;
        background: #0a66ff;
        color: #fff;
        text-align: center;
        padding: 10px 0;
        width: 160px;
      }
    }
  </style>
</head>

<body>

  <a href="https://decodemh.com" class="ad" target="_blank">

    <div class="image">
      <img src="https://images.pexels.com/photos/5424976/pexels-photo-5424976.jpeg" alt="Ad Image">
    </div>

    <div class="content">
      <div>
        <h1>Google Ads Designer</h1>
        <h2>High-Impact Display Ads</h2>
        <p>
          Eye-catching creatives designed for premium placements and high engagement.
        </p>
      </div>

      <span class="cta">Get Started</span>
    </div>

  </a>

</body>

</html>
