<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Generator</title>
<style>
body { font-family: Arial; margin:20px; max-width:800px; }
input,textarea { width:100%; margin-bottom:12px; padding:8px; }
label { font-weight:bold; margin-top:12px; display:block; }
button { padding:10px 20px; background:#0073e6; color:#fff; border:none; cursor:pointer; }
button:hover { background:#005bb5; }
</style>
</head>
<body>

<h1>Banner Generator</h1>

<form id="bannerForm">
  <label>Image URL</label>
  <input type="text" id="image" value="https://via.placeholder.com/150" required>
  <label>Heading (H1)</label>
  <input type="text" id="h1" value="Amazing Product" required>
  <label>Subheading (H2)</label>
  <input type="text" id="h2" value="Limited Time Offer" required>
  <label>Description</label>
  <textarea id="description" rows="3">Get the best deal today!</textarea>
  <label>CTA Text</label>
  <input type="text" id="cta" value="Shop Now" required>
  <label>Brand Color</label>
  <input type="color" id="brandColor" value="#0073e6">
  <button type="submit">Generate Banners</button>
</form>

<div id="result" style="margin-top:20px;"></div>

<script>
var bannerSizes=[
  {width:300,height:100},{width:660,height:100},{width:768,height:100},{width:1024,height:100},{width:1280,height:100},
  {width:1040,height:100},{width:1280,height:300},{width:240,height:620},{width:300,height:250},{width:300,height:300}
];
var tokens={fonts:{heading:"Arial,sans-serif",subheading:"Verdana,sans-serif",body:"Helvetica,sans-serif"},spacing:{small:"8px",medium:"16px"},borderRadius:"4px"};

function generateBannerHTML(content,size){
  var isSmall=size.width<=660;
  var html='<!DOCTYPE html>'+
  '<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">'+
  '<title>Banner '+size.width+'x'+size.height+'</title><style>'+
  'body{margin:0;font-family:'+tokens.fonts.body+';}' +
  '.banner{width:'+size.width+'px;height:'+size.height+'px;display:flex;flex-direction:'+(isSmall?'column':'row')+';align-items:center;padding:'+tokens.spacing.medium+';background:#fff;border:1px solid #ddd;box-sizing:border-box;}' +
  '.banner img{max-width:'+(isSmall?'100%':'30%')+';max-height:'+(size.height-20)+'px;margin-right:'+(isSmall?'0':tokens.spacing.medium)+';margin-bottom:'+(isSmall?tokens.spacing.medium:'0')+';object-fit:cover;}' +
  '.text{flex:1;}' +
  '.text h1{font-family:'+tokens.fonts.heading+';font-size:1.2em;color:'+content.brandColor+';margin:0 0 8px 0;}' +
  '.text h2{font-family:'+tokens.fonts.subheading+';font-size:1em;color:#ffcc00;margin:0 0 8px 0;}' +
  '.text p{margin:0 0 8px 0;font-size:0.9em;color:#333;}' +
  '.cta{padding:8px 16px;display:inline-block;background-color:'+content.brandColor+';color:#fff;text-decoration:none;border-radius:'+tokens.borderRadius+';}' +
  '.cta:hover{background-color:#e03e00;}' +
  '</style></head><body>'+
  '<div class="banner"><img src="'+content.image+'" alt="Banner"/><div class="text"><h1>'+content.h1+'</h1><h2>'+content.h2+'</h2><p>'+content.p+'</p><a href="#" class="cta">'+content.cta+'</a></div></div></body></html>';
  return html;
}

function downloadHTML(filename,html){
  var blob=new Blob([html],{type:"text/html"});
  var link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download=filename;
  link.click();
}

document.getElementById("bannerForm").addEventListener("submit",function(e){
  e.preventDefault();
  var content={
    image:document.getElementById("image").value,
    h1:document.getElementById("h1").value,
    h2:document.getElementById("h2").value,
    p:document.getElementById("description").value,
    cta:document.getElementById("cta").value,
    brandColor:document.getElementById("brandColor").value
  };
  var resultDiv=document.getElementById("result");
  resultDiv.innerHTML='';
  for(var i=0;i<bannerSizes.length;i++){
    var size=bannerSizes[i];
    var html=generateBannerHTML(content,size);
    var btn=document.createElement("button");
    btn.style.marginBottom="5px";
    btn.textContent="Download "+size.width+"x"+size.height;
    (function(filename,htmlContent){ btn.onclick=function(){ downloadHTML(filename,htmlContent); }; })('banner_'+size.width+'x'+size.height+'.html',html);
    resultDiv.appendChild(btn);
  }
});
</script>

</body>
</html>
